id: C_API_AND_MEMORY
title: C API, Memory Management & GC Coordination
summary: Deep dive into LibRuby bindings, Win32 symbol collision isolation, and dual-GC lifecycles.
track: 02_advanced_features
overview: |
  Interfacing Crystal with CRuby requires managing two concurrent runtimes, each equipped
  with its own garbage collector: Crystal's Boehm-Demers-Weiser GC and Ruby's compacting generational GC.

  Rubellite implements strict memory safety protocols and Windows MSVC import isolation
  to eliminate memory corruption, symbol collisions, and dangling references.

related_sources:
  - "src/rubellite/c_api.cr"
  - "src/rubellite/gc.cr"
  - "src/rubellite/tooling/import_lib_generator.cr"

sections:
  - id: topic_01_gc_pinning
    title: Dual-GC Pinning Protocol
    summary: Protecting Ruby objects held inside Crystal memory structures.
    content: |
      Whenever a Crystal struct or class holds a long-lived reference to a `LibRuby::Value`,
      it must be registered with the Ruby GC to prevent the Ruby collector from sweeping or moving it.

      | Mechanism | Function | Purpose |
      | :--- | :--- | :--- |
      | **Root Registration** | `rb_gc_register_address` | Pins a pointer address to prevent GC collection |
      | **Unregistration** | `rb_gc_unregister_address` | Releases the GC root when the Crystal object finalizes |
      | **Temporary Protection** | `Rubellite::GC.protect { ... }` | Protects local values across complex allocations |

    examples:
      - |
        ```crystal
        require "rubellite"

        # Safe allocation with automatic GC pinning
        ref = Rubellite::GC.pinned_value(Rubellite.eval("[1, 2, 3]"))
        # ref is guaranteed not to be moved or collected by CRuby GC
        ref.free # Cleanly unregisters from GC roots
        ```

    pitfalls:
      - "Never pass unpinned Ruby pointers across long-lived Crystal Channels without pinning."
      - "On Windows, always link with ext/ruby_clean.lib to prevent clashing with ucrt symbol definitions."

    faqs:
      - q: "What is ruby_clean.lib?"
        a: "A sanitized import library generated by Rubellite's import_lib_generator to filter out conflicting Win32 symbols."
