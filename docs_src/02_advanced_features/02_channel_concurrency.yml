id: CHANNEL_CONCURRENCY
title: Channel Concurrency & Fiber Interop
summary: Bridging Crystal CSP channels with Ruby scripts and managing the Global VM Lock (GVL).
track: 02_advanced_features
overview: |
  Crystal utilizes lightweight Fibers with non-blocking event loops, while CRuby relies on
  native OS threads constrained by the Global VM Lock (GVL / GIL).

  Rubellite builds a thread-safe bridge (`Rubellite::ChannelBridge`) enabling Crystal fibers
  to stream values directly into Ruby scripts and vice versa without deadlocking the host process.

related_sources:
  - "src/rubellite/channel.cr"
  - "src/rubellite/concurrency.cr"
  - "examples/05_channel_and_fiber_concurrency.cr"

sections:
  - id: topic_01_channel_bridge
    title: ChannelBridge Architecture & Pipeline Streaming
    summary: Bidirectional asynchronous communication between Crystal fibers and Ruby with Queue compatibility.
    content: |
      The `Rubellite::ChannelBridge` exposes send and receive primitives directly to Ruby scripts:

      | Action | Crystal API | Ruby Script Equivalent |
      | :--- | :--- | :--- |
      | **Send** | `channel.send(value)` | `queue.send(val)`, `queue.push(val)`, `queue << val`, `queue.enq(val)` |
      | **Receive** | `channel.receive` | `queue.receive`, `queue.pop`, `queue.deq`, `queue.shift` |
      | **Safe Receive** | `channel.receive?` | `queue.receive?` (returns `nil` on close) |
      | **Iteration** | `while val = chan.receive?` | `queue.each { |item| ... }` (Enumerable streaming) |
      | **Close** | `channel.close` | `queue.close`, `queue.closed?` |

    examples:
      - |
        ```crystal
        require "rubellite"

        # Create typed Crystal channel and export to Ruby
        in_chan = Channel(String).new(10)
        Rubellite.export_channel("work_queue", in_chan)

        # Producer fiber
        spawn do
          ["job_alpha", "job_beta", "job_gamma"].each do |task|
            in_chan.send(task)
          end
          in_chan.close
        end

        # Ruby consumes using idiomatic Enumerable iteration
        Ruby.eval(<<-RUBY)
          work_queue.each do |task|
            puts "Ruby processing \#{task}"
          end
        RUBY
        ```

    pitfalls:
      - "Ruby `receive` releases the GVL via `rb_thread_call_without_gvl`, allowing other Ruby threads and Crystal fibers to progress while waiting."
      - "Multi-fiber concurrent evaluations are serialized safely with re-entrant synchronization (`Ruby.synchronize`)."
      - "Always close channels when producers terminate to avoid leaving Ruby consumer fibers hanging."

    faqs:
      - q: "Is Channel communication thread-safe?"
        a: "Yes, Rubellite synchronizes channel access using Crystal spinlocks and mutexes around Ruby GVL transitions."
