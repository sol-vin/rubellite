id: OVERVIEW
title: Getting Started & System Architecture
summary: Introduction to Rubellite, the bidirectional Crystal <-> Ruby interop engine.
track: 01_getting_started
overview: |
  Rubellite is a high-performance interop framework designed to connect the Crystal
  and Ruby programming environments with zero overhead.

  By pairing Crystal's LLVM-compiled speed with CRuby's expansive dynamic ecosystem,
  Rubellite enables developers to execute Ruby code directly within Crystal fibers,
  share native types, invoke methods with Crystal blocks, and bridge Crystal Channels
  with Ruby concurrency primitives.

related_sources:
  - "shard.yml"
  - "src/rubellite.cr"
  - "src/rubellite/engine.cr"

sections:
  - id: topic_01_architecture
    title: Architectural Principles & Layering
    summary: Breakdown of Rubellite's three core runtime layers.
    content: |
      Rubellite is structured into three distinct layers:

      | Layer | Primary Role | Location |
      | :--- | :--- | :--- |
      | **Crystal Host** | Native execution, fiber scheduling, memory bounds | `src/rubellite/` |
      | **C API Bridge** | Direct bindings to MRI `libruby`, symbol hygiene | `src/rubellite/c_api.cr` |
      | **Diagnostics** | Radare2 symbol auditing, import library generation | `src/rubellite/diagnostics/` |

      Rubellite manages GC safety across both engines: Crystal's Boehm GC and Ruby's
      compacting garbage collector coordinate to ensure unboxed primitives and
      heap-allocated Ruby objects remain valid across calls.

    examples:
      - |
        ```crystal
        require "rubellite"

        # Initialize the embedded Ruby VM
        Rubellite.init

        # Evaluate a Ruby expression and unbox the result
        result = Rubellite.eval("2 + 2")
        puts "Result: #{result.to_i64}" # => 4

        # Clean up VM state on shutdown
        Rubellite.cleanup
        ```

    pitfalls:
      - "Always call Rubellite.init before evaluating code or allocating Ruby values."
      - "Ensure Rubellite.cleanup is invoked during shutdown to run Ruby at_exit handlers."

    faqs:
      - q: "Does Rubellite require a standalone Ruby installation?"
        a: "Yes, Rubellite links dynamically against the system's CRuby shared library (libruby)."
      - q: "What versions of Ruby are supported?"
        a: "CRuby 3.2 through 4.x are supported, with dedicated version branches tracking upstream releases."
