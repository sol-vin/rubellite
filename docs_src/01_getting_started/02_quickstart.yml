id: QUICKSTART
title: Quickstart Guide & Usage Patterns
summary: Step-by-step tutorial on bootstrapping Rubellite, calling methods, and handling errors.
track: 01_getting_started
overview: |
  This guide provides hands-on code examples for embedding Rubellite into your Crystal project,
  evaluating Ruby scripts, calling Ruby methods with arguments, and executing blocks.

related_sources:
  - "examples/01_basic_eval.cr"
  - "examples/03_calling_ruby_methods_and_blocks.cr"
  - "src/rubellite/value.cr"

sections:
  - id: topic_01_eval_and_methods
    title: Evaluating Scripts & Invoking Methods
    summary: Running code strings and dispatching methods dynamically with zero boilerplate.
    content: |
      Rubellite offers high-level helpers on the `Ruby` (or `Rubellite`) module and rich ergonomics on `Rubellite::Value`.
      Initialization is completely automatic: calling `Ruby.eval`, accessing `Ruby["Constant"]`, or invoking `.to_ruby` boots the VM seamlessly on demand.

      | API Method | Target | Description |
      | :--- | :--- | :--- |
      | `Ruby.eval(code)` | Global | Parses and executes a Ruby code string (auto-inits VM) |
      | `Ruby[const_name]` | Global | Resolves a top-level Ruby constant (e.g. `Ruby["JSON"]`) |
      | `Ruby[const_name]?` | Global | Safely resolves a constant, returning `nil` if undefined |
      | `value.call(method, *args)` | Object | Invokes a method with protected SEH execution |
      | `value.call?(method, *args)` | Object | Safe call returning `nil` if an exception occurs |
      | `value.dig(*keys)` | Collection | Safe nested key retrieval across Hashes and Arrays |
      | `value.each(&blk)` | Collection | Yields elements to a Crystal block |
      | `Rubellite.export(name, &blk)` | Global | Exposes a Crystal Proc directly to Ruby as `Rubellite.<name>` |

    examples:
      - |
        ```crystal
        require "rubellite"

        # Auto-initialization: No explicit Rubellite.init needed!
        json = Ruby["JSON"]
        parsed = json.call("parse", %({"name": "Rubellite", "tags": ["crystal", "ruby"]}))

        # Safe nested navigation (interchangeably handles Symbol and String keys)
        puts parsed.dig("tags", 0).try(&.to_s) # => "crystal"

        # Bidirectional Crystal function export
        Rubellite.export("add_numbers") do |args|
          (args[0].to_i64 + args[1].to_i64).to_ruby
        end

        result = Ruby.eval("Rubellite.add_numbers(19, 23)")
        puts result.to_i64 # => 42
        ```

    pitfalls:
      - "Ruby exceptions raised in eval or call are wrapped into Crystal `Rubellite::Error` exceptions preserving backtraces."
      - "CRuby allows only one initialization per OS process. Automatic initialization manages this safely."

    faqs:
      - q: "How do I catch Ruby errors in Crystal?"
        a: "Rescue `Rubellite::Error` — it preserves the Ruby exception class name, message, and backtrace."
