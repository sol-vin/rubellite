id: QUICKSTART
title: Quickstart Guide & Usage Patterns
summary: Step-by-step tutorial on bootstrapping Rubellite, calling methods, and handling errors.
track: 01_getting_started
overview: |
  This guide provides hands-on code examples for embedding Rubellite into your Crystal project,
  evaluating Ruby scripts, calling Ruby methods with arguments, and executing blocks.

related_sources:
  - "examples/01_basic_eval.cr"
  - "examples/03_calling_ruby_methods_and_blocks.cr"
  - "src/rubellite/value.cr"

sections:
  - id: topic_01_eval_and_methods
    title: Evaluating Scripts & Invoking Methods
    summary: Running code strings and dispatching methods dynamically.
    content: |
      Rubellite offers high-level helpers on `Rubellite` and rich methods on `Rubellite::Value`.

      | API Method | Target | Description |
      | :--- | :--- | :--- |
      | `Rubellite.eval(code)` | Global | Parses and executes a Ruby code string |
      | `value.call(method, *args)` | Object | Invokes a method on a Ruby object with arguments |
      | `value.call(method) { |blk| ... }` | Object | Passes a Crystal block to a Ruby method |

    examples:
      - |
        ```crystal
        require "rubellite"

        Rubellite.init

        # Define a Ruby class dynamically
        Rubellite.eval(<<-RUBY)
          class Calculator
            def add(a, b)
              a + b
            end

            def transform(list, &block)
              list.map(&block)
            end
          end
        RUBY

        calc = Rubellite.eval("Calculator.new")
        sum = calc.call("add", 15, 27)
        puts "Sum: #{sum.to_i64}" # => 42

        # Pass a Crystal block to Ruby Enumerable methods
        array = Rubellite.eval("[1, 2, 3, 4, 5]")
        doubled = array.call("map") do |item|
          item.to_i64 * 2
        end
        ```

    pitfalls:
      - "Ruby exceptions raised in eval or call are wrapped into Crystal `Rubellite::Error` exceptions."
      - "Do not capture long-lived Crystal pointers inside Ruby blocks without pinning."

    faqs:
      - q: "How do I catch Ruby errors in Crystal?"
        a: "Rescue `Rubellite::Error` — it preserves the Ruby exception class name, message, and backtrace."
