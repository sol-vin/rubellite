- version: 0.1.16
  date: "2026-10-04"
  status: active
  entries:
  - type: fix
    description: Pre-query Ruby standard library paths before C-API initialization
      to ensure reliable $LOAD_PATH bootstrapping
  - type: perf
    description: Accelerate GC churn stress spec by executing allocation loop natively
      in Ruby bytecode
- version: 0.1.15
  date: "2026-10-04"
  status: released
  entries:
  - type: fix
    description: Eliminate subprocess fork in Engine.init by bootstrapping RbConfig
      standard library load paths directly in memory
  - type: fix
    description: Bound Thread#join in Concurrency GVL test suite with 3-second limit
      to guarantee non-blocking CI execution
  - type: perf
    description: Tune streaming pipeline benchmark to 200 items with 20-second timeout
      for virtualized CI runners
- version: 0.1.14
  date: "2026-10-04"
  status: released
  entries:
  - type: feat
    description: Add comprehensive Rubellite test platform expansion (21 suites, 103
      specs) covering GC invariants, GVL concurrency, and extended types
  - type: feat
    description: Implement CRuby 3.0+ keyword arguments dispatch (`rb_funcallv_kw`)
      and native Ruby exception class raising (`ArgumentError`, `TypeError`, `ZeroDivisionError`)
  - type: feat
    description: 'Support extended Ruby types: nanosecond Time, inclusive/exclusive
      Range, Regexp captures, Set, Rational, Complex, NaN, and Infinity'
  - type: fix
    description: Fix signed Fixnum right-shift unboxing using to_i64! preventing arithmetic
      overflow on negative integers
  - type: fix
    description: Harden without_gvl and with_gvl with exception propagation and NoReturn
      block support
  - type: maintenance
    description: Expand CI matrix to test multiple Ruby versions (Ruby 3.2 and 3.3
      across Linux, macOS, and Windows)
