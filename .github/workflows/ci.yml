name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Ruby ${{ matrix.ruby }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        ruby: ['3.2', '3.3']

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config radare2 gcc
          RUBY_LIBDIR=$(ruby -e "require 'rbconfig'; puts RbConfig::CONFIG['libdir']")
          echo "LD_LIBRARY_PATH=$RUBY_LIBDIR:$LD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Install macOS Dependencies
        if: runner.os == 'macOS'
        run: |
          brew install radare2 pkg-config
          RUBY_LIBDIR=$(ruby -e "require 'rbconfig'; puts RbConfig::CONFIG['libdir']")
          echo "DYLD_LIBRARY_PATH=$RUBY_LIBDIR:$DYLD_LIBRARY_PATH" >> $GITHUB_ENV

      - name: Setup Windows Dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install radare2 -y --no-progress
          $rubyDll = ruby -e "require 'rbconfig'; puts [File.join(RbConfig::CONFIG['bindir'], RbConfig::CONFIG['LIBRUBY_SO'] || ''), File.join(RbConfig::CONFIG['libdir'], RbConfig::CONFIG['LIBRUBY_SO'] || '')].find { |f| File.file?(f) }"
          Write-Host "Discovered Ruby DLL: $rubyDll"
          $rubyBin = Split-Path -Parent $rubyDll
          Add-Content $env:GITHUB_PATH "$rubyBin"
          Add-Content $env:GITHUB_PATH "C:\Program Files\LLVM\bin"
          Add-Content $env:GITHUB_PATH "C:\tools\radare2"
          New-Item -ItemType Directory -Force -Path bin
          Copy-Item $rubyDll -Destination .
          Copy-Item $rubyDll -Destination bin

      - name: Install Shards
        run: shards install

      - name: Setup Windows Import Library
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          crystal run src/rubellite/tooling/import_lib_generator.cr

      - name: Build Rubellite CLI
        run: shards build rubellite

      - name: Run CLI Doctor
        run: ./bin/rubellite doctor

      - name: Run Test Suite
        run: crystal spec --verbose spec/all_spec.cr

      - name: Run Benchmarks
        run: ./bin/rubellite bench

      - name: Run Examples
        run: |
          crystal run examples/01_basic_eval.cr
          crystal run examples/02_type_conversions_and_hash.cr
          crystal run examples/03_calling_ruby_methods_and_blocks.cr
          crystal run examples/04_defining_ruby_classes_in_crystal.cr
          crystal run examples/05_channel_and_fiber_concurrency.cr
          crystal run examples/06_spinel_aot_fastpath.cr
          crystal run examples/07_r2_binary_forensics.cr
